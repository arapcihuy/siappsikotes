# Konfigurasi Cloudflare Worker untuk API SiapPsikotes
name = "siappsikotes-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Route program referensi: /referensi/* di domain utama dilayani Worker ini
# (validasi kode di D1 lalu 302 ke /beli/?ref=KODE; /referensi/draft dilempar
# ke origin statis). Sisa halaman tetap dilayani origin statis.
# CATATAN: kunci ini WAJIB di tingkat atas (sebelum [[...]] pertama) — kalau
# ditaruh setelah bagian tabel, TOML menganggapnya milik tabel tersebut.
routes = [
  { pattern = "siappsikotes.my.id/referensi/*", zone_name = "siappsikotes.my.id" },
  # A/B /beli/ (spesifikasi-ab-beli.md): Worker menukar 4 elemen copy per varian
  # server-side via cookie sp_beli_var. Path /beli* selain dokumen HTML
  # (script.js, style.css, sw.js, ...) dilempar apa adanya ke origin statis.
  { pattern = "siappsikotes.my.id/beli*", zone_name = "siappsikotes.my.id" }
]

# Cron Trigger: tiap 10 menit untuk monitoring /beli/ + snapshot funnel 6 jaman ke KV
# (00/06/12/18 UTC, dijadwalkan dari kode karena batas gratis 5 cron trigger per akun),
# dan 1x sehari (23:55 WIB) laporan funnel harian ke Telegram.
# Rekonsiliasi pagi 08:00 WIB TIDAK berdiri di trigger baru (akun free sudah genap 5 cron
# trigger) — dijadwalkan dari kode pada cron */10 (jam 8 WIB) dengan guard KV sekali/hari.
# Dashboard 1-URL: GET /api/funnel. Rekonsiliasi: GET /api/rekonsiliasi-ringkasan.
[triggers]
crons = ["*/10 * * * *", "55 16 * * *"]

# Database D1 (SQLite di edge). Dibuat di akun pemilik, region APAC.
[[d1_databases]]
binding = "DB"
database_name = "siappsikotes-db"
database_id = "ba629587-6277-4261-aa3e-aab44fd2e17c"

# KV gratis: simpan snapshot funnel harian (dibaca GET /api/funnel, ditulis cron tiap 6 jam)
[[kv_namespaces]]
binding = "FUNNEL_KV"
id = "c353a135b34e49db932341040b371a1d"

# Catatan keamanan:
# - Tidak ada variabel rahasia yang perlu disimpan di sini: identitas pengguna datang dari
#   token Google yang diperiksa tanda tangannya di dalam Worker.
# - JANGAN menaruh kunci rahasia apa pun di berkas ini (berkas ini ikut masuk repositori publik).